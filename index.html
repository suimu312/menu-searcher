<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
    <title>菜单搜索器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍽️ 菜单搜索器</h1>
        <div class="search‑box">
            <input type="text" id="search‑input" placeholder="输入菜名搜索...">
        </div>
        <ul id="menu‑list">
            <li>番茄炒蛋</li>
            <li>红烧肉</li>
            <li>鱼香肉丝</li>
            <li>麻婆豆腐</li>
            <li>宫保鸡丁</li>
            <li>糖醋排骨</li>
            <li>酸辣土豆丝</li>
            <li>水煮鱼</li>
        </ul>
        <div id="no‑tip" class="no‑result">没有找到匹配菜品</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
